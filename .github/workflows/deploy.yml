name: Deploy

# Deploys ClaimTidy to the Hostinger VPS (docs/deploy.md). Manual: Actions → Deploy → Run workflow.
# One server, shared with other apps: everything goes into /opt/claimtidy and ClaimTidy's own
# containers (claimtidy-*); nothing else on the server is touched.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DOMAIN: ${{ vars.CLAIMTIDY_DOMAIN }}
      HOST: ${{ vars.CLAIMTIDY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          [ -n "$DOMAIN" ] || { echo "Set the repository variable CLAIMTIDY_DOMAIN (e.g. claimtidy.com)"; exit 1; }
          [ -n "$HOST" ] || { echo "Set the repository variable CLAIMTIDY_HOST (the server's IP address)"; exit 1; }

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the server's host key when provided; otherwise trust it on first use.
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
          printf 'Host *\n  User root\n  StrictHostKeyChecking %s\n  ServerAliveInterval 30\n' \
            "$([ -n "$KNOWN_HOSTS" ] && echo yes || echo accept-new)" > ~/.ssh/config

      - name: Copy the app
        run: |
          ssh "$HOST" "mkdir -p /opt/claimtidy/app && chmod 700 /opt/claimtidy && (command -v rsync >/dev/null || (apt-get update -q && apt-get install -yq rsync))"
          rsync -az --delete --exclude .git --exclude node_modules --exclude .next --exclude dist \
            --exclude test-results ./ "$HOST:/opt/claimtidy/app/"

      - name: Set up and deploy
        run: ssh "$HOST" "bash /opt/claimtidy/app/infra/hostinger/setup-server.sh $DOMAIN && bash /opt/claimtidy/app/infra/hostinger/deploy.sh"
