# ClaimTidy on a shared Hostinger VPS (v13), layered over the official self-hosted Supabase compose
# file (COMPOSE_FILE in /opt/claimtidy/supabase/.env). Values come from the managed CLAIMTIDY block
# that setup-server.sh writes into that .env.
#
# Built not to affect the other apps on the server:
#   * its own project name, container names and network ("claimtidy");
#   * a memory cap and a CPU cap on every container, and half the normal CPU priority, so under
#     load the server's other apps come first;
#   * log files capped at 3 x 10 MB per container;
#   * nothing listens publicly except Caddy, and only when ports 80/443 were free. Otherwise
#     Caddy listens on 127.0.0.1:18080 and the server's existing web proxy forwards to it.

name: claimtidy

x-limits: &limits
  cpu_shares: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *limits
    container_name: claimtidy-db
    mem_limit: 1g
    cpus: 1.0

  auth:
    <<: *limits
    container_name: claimtidy-auth
    mem_limit: 256m
    cpus: 0.5
    environment:
      # Sign-in by 6-digit code: the email shows the code, not a link.
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://claimtidy-web:3000/email/code.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://claimtidy-web:3000/email/code.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your ClaimTidy code
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your ClaimTidy code
      GOTRUE_MAILER_OTP_EXP: "600"
      # Google/Microsoft keys are for linking the user's Drive/OneDrive (via the API), not sign-in.

  rest:
    <<: *limits
    container_name: claimtidy-rest
    mem_limit: 256m
    cpus: 0.5

  meta:
    <<: *limits
    container_name: claimtidy-meta
    mem_limit: 256m
    cpus: 0.5

  studio:
    <<: *limits
    container_name: claimtidy-studio
    mem_limit: 512m
    cpus: 0.5

  # Supabase's gateway listens on this server only (Docker publishes ports around firewalls).
  api-gw:
    <<: *limits
    container_name: claimtidy-gateway
    mem_limit: 128m
    cpus: 0.5
    ports: !override
      - "127.0.0.1:18000:8000"

  # Not used by ClaimTidy: off. (No file storage at all in v13: receipts stay with the user.)
  storage:
    profiles: ["disabled"]
  imgproxy:
    profiles: ["disabled"]
  functions:
    profiles: ["disabled"]
  realtime:
    profiles: ["disabled"]
  supavisor:
    profiles: ["disabled"]

  claimtidy-api:
    <<: *limits
    container_name: claimtidy-api
    mem_limit: 256m
    cpus: 0.5
    build:
      context: /opt/claimtidy/app
      dockerfile: Dockerfile.service
      args:
        APP: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ORIGIN: https://${CLAIMTIDY_DOMAIN}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_JWT_ISSUER: ${API_EXTERNAL_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      GOOGLE_CLIENT_ID: ${CLAIMTIDY_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${CLAIMTIDY_GOOGLE_SECRET:-}
      MICROSOFT_CLIENT_ID: ${CLAIMTIDY_MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${CLAIMTIDY_MICROSOFT_SECRET:-}

  claimtidy-web:
    <<: *limits
    container_name: claimtidy-web
    mem_limit: 256m
    cpus: 0.5
    build:
      context: /opt/claimtidy/app
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://auth.${CLAIMTIDY_DOMAIN}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_API_URL: https://api.${CLAIMTIDY_DOMAIN}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${CLAIMTIDY_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${CLAIMTIDY_MICROSOFT_CLIENT_ID:-}
    restart: unless-stopped

  caddy:
    <<: *limits
    container_name: claimtidy-caddy
    image: caddy:2.10
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    ports:
      - "${CLAIMTIDY_HTTP_BIND}:80"
      - "${CLAIMTIDY_HTTPS_BIND}:443"
    volumes:
      - /opt/claimtidy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
